<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <!-- <script type="module" src="./js/main.js" defer></script> -->
    <title>Lion School</title>
</head>

<body>
    <header id="header">
        <div class="header-logo">
            <div class="logo">
                <img src="./img/logo-image.png" alt="Logo">
                <span>Lion School</span>
            </div>
            <div class="sair" id="voltar">
                <img src="./img/Vector.png" alt="Sair/Voltar">
                <span id="data">Sair</span>
            </div>
        </div>
    </header>
    <main id="main" class="main-aluno">
        <div class="hero-aluno">
            <div class="caixa aluno">
                <img src="" alt="Imagem do aluno">
                <span>José Matheus da Silva Miranda</span>
            </div>
            <div class="caixa grafico">
                <div class="columns">
                    <span class="nota">90</span>
                    <div class="column">
                        <div class="valor aprovado"></div>
                    </div>
                    <span class="sigla">SOP</span>
                </div>
                <div class="columns">
                    <span class="nota">90</span>
                    <div class="column">
                        <div class="valor recuperacao"></div>
                    </div>
                    <span class="sigla">SOP</span>
                </div>
                <div class="columns">
                    <span class="nota">90</span>
                    <div class="column">
                        <div class="valor reprovado"></div>
                    </div>
                    <span class="sigla">SOP</span>
                </div>
                <div class="columns">
                    <span class="nota">90</span>
                    <div class="column">
                        <div class="valor"></div>
                    </div>
                    <span class="sigla">SOP</span>
                </div>
                <div class="columns">
                    <span class="nota">90</span>
                    <div class="column">
                        <div class="valor"></div>
                    </div>
                    <span class="sigla">SOP</span>
                </div>
                <div class="columns">
                    <span class="nota">90</span>
                    <div class="column">
                        <div class="valor"></div>
                    </div>
                    <span class="sigla">SOP</span>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="frame">
            <div class="info">
                <div class="icons">
                    <img src="./img/phone.png" alt="Telefone">
                    <img src="./img/icon-email.png" alt="Email">
                    <img src="./img/icon-local.png" alt="Local">
                </div>

                <div class="dados">
                    <span class="phone">(11) 4774-4700</span>
                    <span class="email">lionschool@gmail.com</span>
                    <span class="local">Rua tcc, 211, Centro, Jandira</span>
                </div>
            </div>

            <span class="copyright">Copyright © 2026 | Fernando Leonid</span>

            <div class="redes-sociais">
                <div class="border">
                    <img src="./img/icon-youtube.png" alt="Youtube">
                </div>

                <div class="border">
                    <img src="./img/twitter.png" alt="Twitter">
                </div>

                <div class="border">
                    <img src="./img/instagram.png" alt="Instagram">
                </div>

                <div class="border">
                    <img src="./img/facebook.png" alt="Facebook">
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
