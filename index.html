<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <title>Lion School</title>
</head>

<body>
    <header>
        <div class="logo">
            <img src="./img/logo-image.png" alt="Logo">
            <span>Lion School</span>
        </div>
        <div class="sair">
            <img src="./img/Vector.png" alt="Sair">
            <span>Sair</span>
        </div>
    </header>
    <main>
        <div class="hero">
            <div class="hero-left">
                <p>Escolha um <span>curso</span> para gerenciar</p>
                <img src="./img/devices.png" alt="">
            </div>

            <div class="hero-center">
                <img src="./img/studant.png" alt="">
            </div>

            <div class="hero-right">
                <button class="btn-ds">
                    <img src="./img/logo-DS.png" alt="">
                    <span>DS</span>
                </button>

                <button class="redes">
                    <img src="./img/logo-redes.png" alt="">
                    <span>REDES</span>
                </button>
            </div>
        </div>
    </main>
    <footer>
        <div class="frame">
            <div class="info">
                <div class="icons">
                    <img src="./img/phone.png" alt="Telefone">
                    <img src="./img/icon-email.png" alt="Email">
                    <img src="./img/icon-local.png" alt="Local">
                </div>

                <div class="dados">
                    <span class="phone">(11) 4774-4700</span>
                    <span class="email">lionschool@gmail.com</span>
                    <span class="local">Rua tcc, 211, Centro, Jandira</span>
                </div>
            </div>

            <span class="copyright">Copyright © 2026 | Fernando Leonid</span>

            <div class="redes-sociais">
                <div class="border">
                    <img src="./img/icon-youtube.png" alt="Youtube">
                </div>

                <div class="border">
                    <img src="./img/twitter.png" alt="Twitter">
                </div>

                <div class="border">
                    <img src="./img/instagram.png" alt="Instagram">
                </div>

                <div class="border">
                    <img src="./img/facebook.png" alt="Facebook">
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
